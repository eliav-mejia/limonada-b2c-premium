# Publica en GitHub Pages en cada push a main. El sitio es estático: css/sitio.css (Tailwind) y js/main.js (esbuild)
# se compilan y se versionan, así que también funciona abierto desde disco o con Pages «Deploy from a branch».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build        # paginas.py → tsc → Tailwind → esbuild
      - run: npm test
      - name: Copiar solo lo publicable a _site/
        run: |
          mkdir _site
          cp -r index.html 404.html terminos.html marcas membresia ayuda privacidad css js img \
                robots.txt sitemap.xml _headers .well-known _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
